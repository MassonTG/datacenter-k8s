apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "test-app"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/test-app"
        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secret/data/test-app" -}}
          export DB_PASSWORD="{{ .Data.data.db_password }}"
          export API_KEY="{{ .Data.data.api_key }}"
          {{- end }}
    spec:
      serviceAccountName: test-app
      containers:
        - name: test-app
          image: massontg/test-app:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: test-app
  namespace: default
spec:
  type: NodePort
  selector:
    app: test-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30090
